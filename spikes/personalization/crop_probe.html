<!doctype html><meta charset="utf-8"><pre id="out">running</pre>
<script>
// S6: read the size from the header (without decoding), crop to 256x256 and encode to WebP.
function headerSize(buf) {
  const v = new DataView(buf)
  if (v.getUint32(0) === 0x89504e47) return [v.getUint32(16), v.getUint32(20), 'png']
  if (v.getUint16(0) === 0xffd8) {
    let o = 2
    while (o < v.byteLength) {
      const marker = v.getUint16(o); const len = v.getUint16(o + 2)
      if (marker >= 0xffc0 && marker <= 0xffcf && ![0xffc4, 0xffc8, 0xffcc].includes(marker))
        return [v.getUint16(o + 7), v.getUint16(o + 5), 'jpeg']
      o += 2 + len
    }
  }
  if (v.getUint32(0) === 0x52494646 && v.getUint32(8) === 0x57454250) {
    const chunk = String.fromCharCode(...new Uint8Array(buf, 12, 4))
    if (chunk === 'VP8X') return [1 + (v.getUint32(24, true) & 0xffffff), 1 + (v.getUint32(27, true) & 0xffffff), 'webp']
    if (chunk === 'VP8L') { const b = v.getUint32(21, true); return [1 + (b & 0x3fff), 1 + ((b >> 14) & 0x3fff), 'webp'] }
    if (chunk === 'VP8 ') return [v.getUint16(26, true) & 0x3fff, v.getUint16(28, true) & 0x3fff, 'webp']
  }
  return null
}
const toBlob = (c, type, q) => new Promise((r) => c.toBlob(r, type, q))
window.result = (async () => {
  const lines = []
  for (const [w, h] of [[3000, 2000], [2048, 1536], [800, 1200]]) {
    const c = document.createElement('canvas'); c.width = w; c.height = h
    const g = c.getContext('2d')
    const grad = g.createLinearGradient(0, 0, w, h); grad.addColorStop(0, '#e66'); grad.addColorStop(1, '#36c')
    g.fillStyle = grad; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 400; i++) { g.fillStyle = `hsl(${i * 37 % 360} 70% 50%)`; g.fillRect((i * 97) % w, (i * 53) % h, 40, 40) }
    for (const type of ['image/png', 'image/jpeg', 'image/webp']) {
      const src = await toBlob(c, type, 0.9)
      const t0 = performance.now()
      const size = headerSize(await src.slice(0, 65536).arrayBuffer())
      const t1 = performance.now()
      const ok = size && size[0] <= 2048 && size[1] <= 2048
      let out = '-'
      if (ok) {
        const bmp = await createImageBitmap(src)
        const side = Math.min(bmp.width, bmp.height)
        const dst = document.createElement('canvas'); dst.width = dst.height = 256
        dst.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, 256, 256)
        bmp.close()
        const crop = await toBlob(dst, 'image/webp', 0.85)
        out = `${crop.type} ${crop.size} B`
      }
      lines.push(`${w}x${h} ${type}: header=${JSON.stringify(size)} (${(t1 - t0).toFixed(1)} ms) ${ok ? 'accepted' : 'REJECTED'} crop=${out}`)
    }
  }
  document.getElementById('out').textContent = lines.join('\n')
})().catch((e) => { document.getElementById('out').textContent = 'ERROR ' + e })
</script>
