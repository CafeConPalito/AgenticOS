<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;font-family:Ubuntu,system-ui,sans-serif;font-size:13px">
  <sc-if value="{{ item.isApproval }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ item.approve }}" style="height:28px;padding:0 11px;border-radius:7px;border:0;background:var(--primary-action);color:#fff;font-weight:500;display:flex;align-items:center;gap:6px" style-hover="background:var(--primary-action-hover)"><span style="width:13px;height:13px;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/check.svg) center/contain no-repeat"></span>Aprobar</button>
    <button onClick="{{ item.reject }}" style="height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--foreground)" style-hover="background:var(--accent)">Rechazar</button>
  </sc-if>
  <sc-if value="{{ item.isQuestion }}">
    <sc-for list="{{ item.opts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.on }}" style="height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--foreground)" style-hover="border-color:var(--ring)">{{ o.label }}</button></sc-for>
  </sc-if>
  <sc-if value="{{ item.needsReply }}">
    <div style="flex:1;min-width:220px;display:flex;gap:6px">
      <input value="{{ item.reply }}" onChange="{{ item.onReply }}" onKeyDown="{{ item.onReplyKey }}" placeholder="{{ item.replyPh }}" aria-label="Respuesta" style="flex:1;min-width:0;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--input);background:var(--card);color:var(--foreground);font:inherit">
      <button onClick="{{ item.send }}" style="height:28px;padding:0 11px;border-radius:7px;border:0;background:var(--primary-action);color:#fff;font-weight:500" style-hover="background:var(--primary-action-hover)">Responder</button>
    </div>
  </sc-if>
  <sc-if value="{{ item.isInterrupted }}">
    <button onClick="{{ item.resume }}" style="height:28px;padding:0 11px;border-radius:7px;border:0;background:var(--primary-action);color:#fff;font-weight:500;display:flex;align-items:center;gap:6px" style-hover="background:var(--primary-action-hover)"><span style="width:13px;height:13px;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/play.svg) center/contain no-repeat"></span>Reanudar sesión</button>
    <button onClick="{{ item.discard }}" style="height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--foreground)" style-hover="background:var(--accent)">Descartar y reencolar</button>
  </sc-if>
  <sc-if value="{{ item.isDone }}">
    <button onClick="{{ item.ack }}" style="height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--foreground)" style-hover="background:var(--accent)">Marcar como revisado</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:48},&quot;item&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;isApproval&quot;:true},&quot;tsType&quot;:&quot;InboxRequestVM&quot;}}"></script>
</body>
</html>
