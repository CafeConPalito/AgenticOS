<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic OS</title>
    <script>
      // Phase 20: paint the last theme before React mounts (theme/apply.ts writes it).
      try {
        var root = document.documentElement
        var applied = JSON.parse(localStorage.getItem('agentic-os.theme.applied') || 'null')
        if (applied && applied.vars) {
          for (var name in applied.vars) root.style.setProperty(name, applied.vars[name])
          if (applied.base === 'light') root.classList.remove('dark')
        } else if (localStorage.getItem('agentic-os.theme') === 'light')
          root.classList.remove('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
