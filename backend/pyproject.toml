[project]
name = "agentic-os"
version = "0.9.3"
description = "Agentic OS backend"
license = "GPL-3.0-or-later"
authors = [{ name = "Albano Díez de Paulino", email = "contacto@cafeconpalito.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pywinpty>=3.0 ; sys_platform == 'win32'",
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pyte>=0.8",
    "websockets>=15",
    "mcp>=2.3",
    "httpx>=0.28",
    "markitdown[docx,pptx]>=0.1.8",
    "openpyxl>=3.1.5",
    "pypdfium2>=5.14.0",
    "trafilatura>=2.3.1",
    "psutil>=7.2.2",
    "pillow>=13.0.0",
    "rapidocr>=3.10.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.20.1",
    "tokenizers>=0.23.3",
    "networkx>=3.7",
    "pyyaml>=6.0",
    "keyring>=25",
]

[project.scripts]
agentic-os-backend = "agentic_os.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyinstaller>=6.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The CLIs draw their menus with ❯; matching it is intentional.
allowed-confusables = ["❯", "›"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic: long SQL literals are expected.
"src/agentic_os/db/migrations/versions/*" = ["E501"]
# Generated by spikes/knowledge/s10_emit_catalog.py: one long line per pinned file.
"src/agentic_os/services/localmodels/_pins.py" = ["E501"]
# The Architect's instructions: Markdown prose for the model, one paragraph per line.
"src/agentic_os/services/architect/prompts.py" = ["E501"]
# Fixtures imported from test_scheduler.py are used by name, which ruff reads as a redefinition.
"tests/test_lanes.py" = ["F811"]
"tests/test_local_models_bundled.py" = ["F811"]
"tests/test_knowledge_describe.py" = ["F811"]
"tests/test_decider.py" = ["F811"]
"tests/test_lanes_git.py" = ["F811"]
