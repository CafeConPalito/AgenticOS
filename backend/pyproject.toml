[project]
name = "agentic-os"
version = "0.1.0"
description = "Agentic OS backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pywinpty>=3.0 ; sys_platform == 'win32'",
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pyte>=0.8",
]

[project.scripts]
agentic-os-backend = "agentic_os.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
    "pyinstaller>=6.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
