[package]
name = "agentic-os"
version = "1.0.0"
description = "Agentic OS desktop shell"
license = "GPL-3.0-or-later"
authors = ["Albano Díez de Paulino <contacto@cafeconpalito.com>"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "agentic_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
